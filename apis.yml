description: >-
  The US Department of Commerce is responsible for promoting economic growth and job creation in the United States. It
  oversees various programs and initiatives aimed at supporting businesses, industries, and communities across the
  country. The department works to ensure fair trade practices, protect intellectual property, and promote innovation
  and entrepreneurship. It also collects and analyzes economic data to inform policy decisions and help businesses make
  informed decisions. The Commerce Department houses bureaus including the Census Bureau, Bureau of Economic Analysis,
  International Trade Administration, NOAA, and NIST, each offering public APIs for their respective data domains.
